<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene Snapshot to Slideshow</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        /* 3D Viewport */
        #viewport {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .viewport-instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #cbd5e1;
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            padding: 8px 10px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Slide List Container */
        .slide-list {
            flex: 1;
            overflow-y: auto;
            max-height: 140px;
            margin-top: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 5px;
        }

        .slide-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .slide-item button {
            background: #ef4444;
            color: white;
            width: auto;
            padding: 2px 6px;
            font-size: 0.75rem;
        }

        .export-btn {
            background-color: #10b981;
            color: white;
            margin-top: auto;
            font-size: 1rem;
            padding: 12px;
        }

        .export-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Scene Snapshot to Slideshow</h1>
        <p>Position your 3D view, snap a picture from that exact spot, and build a presentation deck!</p>
    </header>

    <div class="main-container">
        <div class="card">
            <h2>3D Scene Viewport</h2>
            <div id="viewport">
                <div class="viewport-instructions">Drag to Rotate | Scroll to Zoom</div>
            </div>
            
            <div class="form-group" style="margin-top: 5px;">
                <label for="shapeSelect">Add Object to Scene</label>
                <div style="display: flex; gap: 8px;">
                    <select id="shapeSelect" style="flex:1; padding: 8px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px;">
                        <option value="cube">Cube</option>
                        <option value="sphere">Sphere</option>
                        <option value="torus">Torus (Donut)</option>
                        <option value="cone">Cone</option>
                    </select>
                    <button id="addObjectBtn" style="width: auto; padding: 8px 15px;">Add</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Capture Slide Snapshot</h2>
            <div class="form-group">
                <label for="slideTitle">Slide Title</label>
                <input type="text" id="slideTitle" placeholder="e.g., Front Perspective View">
            </div>
            <div class="form-group">
                <label for="slideText">Slide Notes / Description</label>
                <textarea id="slideText" placeholder="Describe this specific scene perspective..."></textarea>
            </div>
            <button id="captureBtn">Snap & Add to Deck</button>

            <h2 style="margin-top: 15px;">Captured Deck Slides (<span id="slideCount">0</span>)</h2>
            <div class="slide-list" id="slideListContainer">
                </div>

            <button class="export-btn" id="exportBtn" style="margin-top: 15px;">Download .PPTX / Google Slides File</button>
        </div>
    </div>

    <script>
        // --- 1. THREE.JS SCENE SETUP ---
        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        viewport.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Add a grid floor helper
        const gridHelper = new THREE.GridHelper(10, 10, 0x38bdf8, 0x334155);
        scene.add(gridHelper);

        // Default initial object
        const defaultGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const defaultMaterial = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
        const defaultMesh = new THREE.Mesh(defaultGeometry, defaultMaterial);
        defaultMesh.position.y = 0.75;
        scene.add(defaultMesh);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resizing for viewport
        window.addEventListener('resize', () => {
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        });

        // --- 2. OBJECT GENERATOR LOGIC ---
        document.getElementById('addObjectBtn').addEventListener('click', () => {
            const type = document.getElementById('shapeSelect').value;
            let geometry;
            
            if (type === 'cube') geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            else if (type === 'sphere') geometry = new THREE.SphereGeometry(0.8, 32, 32);
            else if (type === 'torus') geometry = new THREE.TorusGeometry(0.8, 0.3, 16, 100);
            else if (type === 'cone') geometry = new THREE.ConeGeometry(0.8, 1.5, 32);

            const randomColor = Math.random() * 0xffffff;
            const material = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.4 });
            const mesh = new THREE.Mesh(geometry, material);

            // Randomize position slightly near center
            mesh.position.set((Math.random() - 0.5) * 3, 1, (Math.random() - 0.5) * 3);
            scene.add(mesh);
        });

        // --- 3. SLIDE CAPTURE STATE ---
        let capturedSlides = [];

        const slideTitleInput = document.getElementById('slideTitle');
        const slideTextInput = document.getElementById('slideText');
        const slideListContainer = document.getElementById('slideListContainer');
        const slideCountEl = document.getElementById('slideCount');

        function updateUI() {
            slideCountEl.textContent = capturedSlides.length;
            slideListContainer.innerHTML = '';

            capturedSlides.forEach((slide, index) => {
                const item = document.createElement('div');
                item.className = 'slide-item';
                item.innerHTML = `
                    <span><strong>#${index + 1}</strong>: ${escapeHtml(slide.title)}</span>
                    <button onclick="removeSlide(${index})">X</button>
                `;
                slideListContainer.appendChild(item);
            });
        }

        document.getElementById('captureBtn').addEventListener('click', () => {
            const title = slideTitleInput.value.trim();
            const text = slideTextInput.value.trim();

            if (!title) {
                alert("Please provide a title for this slide snapshot.");
                return;
            }

            // Force render current camera state to canvas buffer
            renderer.render(scene, camera);
            // Grab image screenshot as base64 data URL
            const imageDataUrl = renderer.domElement.toDataURL("image/png");

            capturedSlides.push({
                title,
                text: text || "",
                image: imageDataUrl
            });

            slideTitleInput.value = '';
            slideTextInput.value = '';
            updateUI();
        });

        window.removeSlide = function(index) {
            capturedSlides.splice(index, 1);
            updateUI();
        }

        // --- 4. EXPORT TO PPTX / GOOGLE SLIDES ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (capturedSlides.length === 0) {
                alert("Capture at least one 3D slide snapshot before exporting!");
                return;
            }

            let pptx = new PptxGenJS();

            capturedSlides.forEach(slideData => {
                let slide = pptx.addSlide();
                slide.background = { color: "0F172A" };

                // Add Title
                slide.addText(slideData.title, {
                    x: 0.8,
                    y: 0.5,
                    w: "80%",
                    h: 0.8,
                    fontSize: 24,
                    bold: true,
                    color: "38BDF8"
                });

                // Add the 3D Snapshot Image rendered from the exact camera view
                slide.addImage({
                    data: slideData.image,
                    x: 0.8,
                    y: 1.4,
                    w: 5.5,
                    h: 3.3
                });

                // Add Description Text Box next to/below image
                if (slideData.text) {
                    slide.addText(slideData.text, {
                        x: 6.6,
                        y: 1.4,
                        w: 5.5,
                        h: 3.3,
                        fontSize: 15,
                        color: "F8FAFC",
                        valign: "top"
                    });
                }
            });

            pptx.writeFile({ fileName: "3d-scene-presentation.pptx" })
                .catch(err => {
                    console.error("Export error:", err);
                    alert("An error occurred during export.");
                });
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
